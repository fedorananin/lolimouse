# Build and test on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Run tests
        run: make test

      - name: Assemble the bundle
        run: make bundle
